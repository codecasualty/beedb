  <g stroke="#0b0a07" stroke-width="4.5" stroke-linecap="round">
    <path d="M32 25 L22 41"/><path d="M32 25 L42 41"/>
  </g>
  <circle cx="32" cy="25" r="8.5" fill="#0b0a07"/>
  <circle cx="21" cy="41" r="5.5" fill="#0b0a07"/>
  <circle cx="43" cy="41" r="5.5" fill="#0b0a07"/>
</svg>
