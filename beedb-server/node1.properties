# =============================================================
#  BeeDB node configuration
#
#  One file per node. Start with:
#      java -jar beedb-server.jar node1.properties
#
#  A 3-node cluster needs three of these, differing only in
#  nodeId, the two ports, and the peers list.
# =============================================================

# ---- Identity -----------------------------------------------

# Must be unique across the cluster. Doubles as the directory
# name for this node's state/snapshot/wal files, so changing it
# after first start orphans all existing data for this node.
# if nothing is provided node1 will be used
nodeId=node1

# ---- Network ------------------------------------------------

# Clients connect here and speak the memcached text protocol.
# mandatory field, if not provided application will throw exception
clientPort=11211

# Peers connect here for Raft RPCs (RequestVote, AppendEntries,
# InstallSnapshot). Must differ from clientPort.
# mandatory field, if not provided application will throw exception
raftPort=12221

# Every OTHER node's raftPort, comma separated. Do NOT list this
# node. Cluster size is defined by this list, not by who happens
# to be reachable: a 3-node cluster always needs 2 votes for a
# majority, even when only 2 nodes are alive.
# mandatory field, if not provided application will throw exception
peers=127.0.0.1:12222,127.0.0.1:12223

# ---- Durability ---------------------------------------------
# Three separate stores, all written before a write is acked.

# currentTerm + votedFor. Lost data here can let a node vote
# twice in one term, which permits two leaders. Fatal if unwritable.
# default value is state
stateDir=state

# Point-in-time cache snapshots, taken every snapshotThreshold
# applied entries. Lets the log be truncated.
# default value is snapshot
snapshotDir=snapshot

# Write-ahead log. Every entry is fsync'd here BEFORE the node
# acknowledges it, so an acked write survives a crash.
# default value is wal
walDir=wal

# Scratch space for atomic writes: files are written here, fsync'd,
# then atomically renamed into place. Must be on the SAME
# filesystem as the directories above, or the rename isn't atomic.
# default value is tmp
tmpDir=tmp

# ---- Tuning -------------------------------------------------

# Applied entries before a snapshot is taken and the log compacted.
# snapShotThreshold is trigger point for taking snapshot
# lastApplied >= snapShotThreshold means we have to take snapshot
# snapShotLimit means how many entries needs to be accumulated before taking 
# another snapshot , snapShotThreshold = snapShotApplied + snapShotLimit
snapShotThreshold=1000
snapShotLimit=1000

# Election timeout range, milliseconds. A follower that hears no
# heartbeat within a random value in this range starts an election.
# MUST be several times the heartbeat interval, or healthy nodes
# will trigger spurious elections. Randomised so nodes don't all
# campaign at once and split the vote.
# default values are 150 and 300 respectively
electionTimeoutMinMs=150
electionTimeoutMaxMs=300

# Interval between AppendEntries to each peer, milliseconds.
# Doubles as the heartbeat. Must stay well below
# electionTimeoutMinMs.
heartbeatIntervalMs=100

# Interval between heartbeats, milliseconds. Must be greater than
# heartbeatIntervalMs.
peerRetryBackoffInitialMs=200

# Maximum interval between heartbeats, milliseconds
# default values is 1000
peerRetryBackoffMaxMs=1000

