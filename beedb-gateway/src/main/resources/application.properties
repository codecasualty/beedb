server.port=8080
beedb.nodes.node1=localhost:11211
beedb.nodes.node2=localhost:11212
beedb.nodes.node3=localhost:11213

# How long a written key lives, seconds. Must stay under 2592000 (30 days) or
# memcached reads it as an absolute unix timestamp rather than a duration.
beedb.key-ttl-seconds=86400

# Writes (PUT/DELETE) allowed per client IP per hour. Keyed on the address, not on
# X-Beedb-Session -- that header is browser-generated and a limit keyed on it limits
# nobody. Fixed window, not sliding.
beedb.max-writes-per-hour=10

# Behind nginx/Cloudflare the remote address is the proxy, so every visitor would
# look like one client. Uncomment once nginx is actually setting X-Forwarded-For,
# and not before: trusting the header without a trusted proxy in front lets anyone
# forge their source address and bypass the limit entirely.
# server.forward-headers-strategy=NATIVE

# Largest value a client may store, bytes.
#
# This is a hard cap, not a tuning knob. The server reads a command into a single
# 4096-byte ByteBuffer and pulls the value straight out of it, so anything that does
# not fit in one read() throws BufferUnderflowException -- and the resulting
# ClosedChannelException has been observed killing the node outright. Until the
# server's read path accumulates properly, this is what stands between a public
# demo and a stranger with curl.
beedb.max-value-bytes=1400
